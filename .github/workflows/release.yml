name: Release public OpenAPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            exit 0
          fi
          VERSION="${TAG#v}"
          notes_file="$(mktemp)"
          trap 'rm -f "${notes_file}"' EXIT
          printf 'Generated from the private Fluveo API contract.\n' > "${notes_file}"
          gh release create "${TAG}" openapi/spec3.json openapi/spec3.yaml \
            --title "Fluveo API ${VERSION}" --notes-file "${notes_file}"
